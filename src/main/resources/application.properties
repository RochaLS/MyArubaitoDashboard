# suppress inspection "SpellCheckingInspection" for whole file

# "local" is the historical default, so prod-only cookie beans stay off unless
# you opt in. Set APP_PROFILE=prod on the public host if you want them.
# APP_PROFILE is used instead of SPRING_PROFILES_ACTIVE so this line is not circular.
spring.profiles.active=${APP_PROFILE:local}

# --- Database ---------------------------------------------------------------
# Any one of these styles works. A value that is already jdbc:mysql:// is used
# as-is, which is how this app is configured on Railway today.
#
# Preferred on Coolify, Docker, or any other host (these override the lines below):
#   SPRING_DATASOURCE_URL=jdbc:mysql://HOST:3306/DB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
#
# Current Railway names, still honored:
#   DATABASE_URL          jdbc:mysql://...   (or mysql://user:pass@host:port/db)
#   DATABASE_USER
#   DATABASE_PASSWORD
#
# Railway MySQL plugin names. Used only when DATABASE_URL and MYSQL_URL are unset:
#   MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD
#   MYSQL_URL / MYSQLURL  mysql://user:pass@host:port/db  (rewritten to jdbc at startup)

spring.datasource.url=${DATABASE_URL:${MYSQL_URL:${MYSQLURL:jdbc:mysql://${MYSQLHOST:127.0.0.1}:${MYSQLPORT:3306}/${MYSQLDATABASE:myarubaito}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}}}
spring.datasource.username=${DATABASE_USER:${MYSQLUSER:${MYSQL_USER:root}}}
spring.datasource.password=${DATABASE_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari's default is 10 connections kept open. This API shares a ~4 GB machine
# with MySQL, so the pool stays small unless you raise it.
spring.datasource.hikari.pool-name=myarubaito
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAXIMUM_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MINIMUM_IDLE:1}
spring.datasource.hikari.connection-timeout=20000

# Copy the value already set on Railway. Do not use create or create-drop:
# those drop tables. There is no Flyway/Liquibase migration in this repo;
# Hibernate is what creates and updates the schema.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO}

# --- HTTP -------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
# Coolify and Railway terminate HTTPS in front of the app. Set
# SERVER_FORWARD_HEADERS_STRATEGY=framework on Coolify so the app sees https.
# The default keeps the previous behavior.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Tomcat's default is 200 threads. This service does not need that many, and
# each thread reserves stack space. Raise these only if requests start waiting.
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:40}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:4}

server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE}
server.servlet.session.cookie.domain=${COOKIE_DOMAIN_NAME}

# --- Secrets (set in the host, never in this file) -------------------------
aws.kms.cmkArn=${AWS_KMS_CMK_ARN}
# Default matches the region previously hardcoded in EncryptionService.
aws.region=${AWS_REGION:us-east-2}

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
# Optional. Password reset is the only feature that sends mail, and it fails
# at send time if these are empty. Startup does not require them.
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

allowed.origins=${ALLOWED_ORIGINS:http://localhost:3000}

# Also required at startup. The Java code reads these names directly:
#   GEMINI_API_KEY
#   JWT_SECRET            at least 32 characters; copy the existing value or every login breaks
#   JWT_EXPIRATION        number of seconds
#   RESET_PASSWORD_URL
# The AWS SDK also reads AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
